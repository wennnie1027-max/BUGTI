<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUG-TI | 动态赛博生存图鉴</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全局 CSS 变量（基准主题） */
        :root {
            --primary: #00ff41;
            --bg-color: #050505;
            --border-glow: rgba(0, 255, 65, 0.5);
            --alert: #ff3131;
            --font-main: 'VT323', 'Courier New', Courier, monospace;
        }

        /* ====== 7大动态结果主题 ====== */
        body.theme-sike { --primary: #ff5722; --bg-color: #1a0500; --border-glow: rgba(255, 87, 34, 0.5); }
        body.theme-bailan { --primary: #78909c; --bg-color: #080c0f; --border-glow: rgba(120, 144, 156, 0.3); }
        body.theme-kongchang { --primary: #00e5ff; --bg-color: #00111a; --border-glow: rgba(0, 229, 255, 0.5); }
        body.theme-zouxin { --primary: #ff80ab; --bg-color: #1a000d; --border-glow: rgba(255, 128, 171, 0.5); }
        body.theme-ganfan { --primary: #ffea00; --bg-color: #1a1800; --border-glow: rgba(255, 234, 0, 0.5); }
        body.theme-xuanxue { --primary: #d4af37; --bg-color: #121005; --border-glow: rgba(212, 175, 55, 0.5); }
        /* 隐藏款专属破防 UI */
        body.theme-hidden { 
            --primary: #ff0000; --bg-color: #1a0000; --border-glow: rgba(255, 0, 0, 0.8);
            animation: screen-shake 0.3s infinite;
        }

        * { box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg-color);
            color: var(--primary);
            font-family: var(--font-main);
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 1.5s ease, color 1.5s ease;
        }

        /* 扫描线效果 */
        body::before {
            content: ""; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 10; pointer-events: none;
        }

        /* 主终端窗口 */
        .terminal-window {
            width: 95%; max-width: 900px; height: 85vh; max-height: 700px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary);
            box-shadow: inset 0 0 0 1px var(--border-glow), 0 0 20px var(--border-glow);
            position: relative;
            display: flex; flex-direction: column;
            transition: border-color 1.5s ease, box-shadow 1.5s ease;
        }

        .window-header {
            height: 30px; background: var(--primary); color: var(--bg-color);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; font-weight: bold; font-size: 18px;
            transition: background-color 1.5s ease, color 1.5s ease;
        }

        .content-area {
            padding: 30px 40px; flex: 1; overflow-y: auto; position: relative;
        }

        .hidden { display: none !important; }

        /* ======== 阶段一：开场 UI ======== */
        .warning-box {
            border: 1px dashed var(--alert); padding: 15px; margin-bottom: 20px;
            color: var(--alert); background: rgba(255, 49, 49, 0.1);
            animation: flicker 2s infinite;
        }

        h1 { font-size: 40px; margin: 0 0 20px 0; text-shadow: 0 0 8px var(--primary); }
        .intro-p { font-size: 22px; line-height: 1.5; margin-bottom: 15px; }
        
        .btn {
            background: transparent; border: 1px solid var(--primary);
            color: var(--primary); padding: 12px 25px;
            font-family: var(--font-main); font-size: 22px;
            margin-top: 20px; transition: 0.3s; text-transform: uppercase;
        }
        .btn:hover { background: var(--primary); color: var(--bg-color); box-shadow: 0 0 15px var(--border-glow); }

        /* ======== 阶段二：答题 UI ======== */
        .progress-wrapper {
            width: 100%; height: 10px; border: 1px solid var(--primary);
            margin-bottom: 25px; position: relative;
        }
        .progress-bar {
            height: 100%; background: var(--primary); width: 0%;
            transition: width 0.4s ease-out;
        }
        
        .cmd-line { color: #888; font-size: 18px; margin-bottom: 10px; }
        #q-text { font-size: 26px; border-bottom: 1px dashed #333; padding-bottom: 15px; margin-bottom: 25px; }
        
        .option-item {
            padding: 15px; border: 1px solid #333; margin-bottom: 15px;
            font-size: 20px; transition: 0.2s; position: relative;
            background: rgba(255,255,255,0.02);
        }
        .option-item:hover {
            border-color: var(--primary); padding-left: 30px;
            background: rgba(255,255,255,0.08); box-shadow: inset 2px 0 0 var(--primary);
        }
        .option-item::before { content: "[ ] "; color: #555; transition: 0.2s; }
        .option-item:hover::before { content: "[x] "; color: var(--primary); }

        /* ======== 阶段中间：计算中 UI ======== */
        #calculating { text-align: center; margin-top: 20%; }
        .loader { font-size: 40px; animation: blink 0.8s infinite; }

        /* ======== 阶段三：结果 UI ======== */
        .result-code {
            font-size: 36px; background: var(--primary); color: var(--bg-color);
            padding: 8px 20px; display: inline-block; margin-bottom: 15px;
            font-weight: bold;
        }
        #res-tags { font-size: 20px; opacity: 0.9; margin-bottom: 15px; letter-spacing: 2px;}
        #res-quote { font-size: 22px; font-style: italic; border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 25px; background: rgba(255,255,255,0.05); padding: 10px 10px 10px 15px;}
        #res-desc { font-size: 18px; line-height: 1.6; }
        
        #radar-container { width: 100%; max-width: 350px; margin: 20px auto; }
        
        /* 动画关键帧 */
        @keyframes flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: 0.4; } }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes screen-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .glitch-text { animation: glitch-anim 0.3s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0); text-shadow: none; }
            20% { transform: translate(-2px, 2px); text-shadow: 2px 0 blue, -2px 0 yellow; }
            40% { transform: translate(2px, -2px); text-shadow: -2px 0 red, 2px 0 green; }
            60% { transform: translate(-2px, 0px); text-shadow: none; }
            100% { transform: translate(0); text-shadow: none; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); }
    </style>
</head>
<body>

<div class="terminal-window">
    <div class="window-header">
        <span id="header-title">root@psy-ai:~/bug-ti</span>
        <span>_ □ X</span>
    </div>

    <div class="content-area">
        <!-- 阶段一：开场 -->
        <div id="intro">
            <div class="warning-box">
                ⚠️ [System Warning] 检测到当前访问者精神状态极度不稳定，脑波频率异常……
            </div>
            <h1>「北师大心理AI学生赛博生存图鉴」</h1>
            <p class="intro-p">在被 Error 糊脸、被离散数学碾压、被无尽的 DDL 疯狂追赶的每一天里，你的大脑究竟是靠什么在维持运转？</p>
            <p class="intro-p" style="color: #aaa;">是撞死在南墙上的绝对理智？是遇事不决先吃一顿的本能多巴胺？还是物理断电的终极摆烂？</p>
            <p class="intro-p">> 准备好直面你的底层代码了吗？ (y/n)</p>
            <button class="btn" onclick="startQuiz()">> ./execute.sh</button>
        </div>

        <!-- 阶段二：答题 -->
        <div id="quiz" class="hidden">
            <div class="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="cmd-line" id="q-id">Loading module...</div>
            <div id="q-text"></div>
            <div id="options"></div>
        </div>

        <!-- 阶段过渡：计算中 -->
        <div id="calculating" class="hidden">
            <div class="loader">DECODING YOUR BRAIN...</div>
            <p style="margin-top: 20px; color: #888;">正在解析隐藏变量...</p>
        </div>

        <!-- 阶段三：结果 -->
        <div id="result" class="hidden">
            <div class="cmd-line">>> System output:</div>
            <div class="result-code" id="res-id"></div>
            <div id="res-tags"></div>
            <div id="res-quote"></div>
            <div id="res-desc"></div>
            
            <div id="radar-container">
                <canvas id="radarChart"></canvas>
            </div>
            <button class="btn" onclick="location.reload()" style="margin-top: 30px;">> sudo reboot</button>
        </div>
    </div>
</div>

<script>
    const scores = { sike: 0, bailan: 0, kongchang: 0, zouxin: 0, ganfan: 0, xuanxue: 0 };
    let pofang = 0;
    let currentIdx = 0;

    const questions = [
        { text: "写数据结构代码弹出一大堆 Error，你的反应是：", opts: [
            { t: "深吸一口气平复心情，逐行 Debug", d: "sike" },
            { t: "怀疑人生，为何心理学人要被指针折磨？！", d: "pofang" },
            { t: "打开赛博义母 (AI) 寻求救赎", d: "kongchang" },
            { t: "毁灭吧，去操场刷个步数打卡", d: "ganfan" },
            { t: "给电脑磕一个，求它行行好", d: "xuanxue" }
        ]},
        { text: "看到“我爱我” (525) 这个主题，你第一反应是：", opts: [
            { t: "自我关怀 (self-care)，很心理学", d: "zouxin" },
            { t: "来点好吃的奖励自己", d: "ganfan" },
            { t: "离期末考还有 20 天，压力激增", d: "pofang" },
            { t: "更爱明天不用早八的自己", d: "bailan" }
        ]},
        { text: "面对离散数学里的逻辑推导证明题：", opts: [
            { t: "“如果 P 那么 Q……我选择 False。”", d: "bailan" },
            { t: "在草稿纸上画巨大的真值表穷举所有可能", d: "sike" },
            { t: "瞬间理清逻辑链路，步步推演轻松证毕", d: "kongchang" },
            { t: "它之所以成立是因为教材写了，愿吃素换它正确", d: "xuanxue" }
        ]},
        { text: "你的“自我”(Ego) 在弗洛伊德结构中主要扮演：", opts: [
            { t: "理智调解员，在两端端水", d: "zouxin" },
            { t: "本我的嘴替，主打“我要快乐”", d: "ganfan" },
            { t: "超我的傀儡，天天自我 PUA", d: "pofang" },
            { t: "一个运行时错误 (Runtime Error)，经常崩溃", d: "sike" }
        ]},
        { text: "你手机里用来对抗焦虑的“终极武器”是：", opts: [
            { t: "正念冥想 App (最后的倔强)", d: "zouxin" },
            { t: "外卖 App (多巴胺速效救心丸)", d: "ganfan" },
            { t: "社交媒体 (逃避可耻但有用)", d: "bailan" },
            { t: "手机本身 (只要我刷得够快焦虑就追不上我)", d: "kongchang" }
        ]},
        { text: "朋友倾诉情感问题时，你的大脑模式是：", opts: [
            { t: "共情模式：我很理解你的情绪...", d: "zouxin" },
            { t: "CBT 模式：分析一下自动化思维", d: "sike" },
            { t: "吃瓜模式：细说，然后呢？", d: "kongchang" },
            { t: "宕机模式：啊这...要不你吃点好的？", d: "ganfan" }
        ]},
        { text: "老师在黑板上推导泰勒展开式，台下的你：", opts: [
            { t: "已经安详地闭上眼接受脑子被碾压的现实", d: "bailan" },
            { t: "奋笔疾书，留着今晚慢慢 Debug", d: "sike" },
            { t: "思绪已经飘到了食堂", d: "ganfan" },
            { t: "So easy ~ 每一步都轻而易举", d: "kongchang" }
        ]},
        { text: "半夜 12:30 发现明早有作业要交：", opts: [
            { t: "安详睡觉。只要我睡着了作业就不存在", d: "bailan" },
            { t: "惊坐起，一顿狂敲逻辑依旧清晰", d: "sike" },
            { t: "破防！怒锤床板，求室友借作业参考", d: "pofang" },
            { t: "觉得今晚不宜动脑，明早 7 点补救", d: "xuanxue" }
        ]},
        { text: "看到朋友圈有人学到图书馆闭馆：", opts: [
            { t: "内心 OS：这人指定有点毛病", d: "bailan" },
            { t: "点个赞，暗暗比较学习时长差距", d: "sike" },
            { t: "评论：太强了！等下去不去吃烧烤？", d: "ganfan" },
            { t: "屏蔽此人。我不允许卷王破坏我的松弛感", d: "zouxin" }
        ]},
        { text: "手机屏幕使用时长排第一的应用：", opts: [
            { t: "B站/抖音 (让 CPU 彻底停转进入 NULL)", d: "bailan" },
            { t: "CSDN/GitHub/AI (疯狂找报错解法)", d: "sike" },
            { t: "淘宝/美团 (恩格尔系数极高)", d: "ganfan" },
            { t: "小红书 (每日阅读量全靠它)", d: "zouxin" }
        ]},
        { text: "520 那天你在做什么？", opts: [
            { t: "和对象卿卿我我", d: "zouxin" },
            { t: "计算：大学找到 Debug 对象的概率是多少？", d: "sike" },
            { t: "狠狠炫一顿丰盛美食，甩掉杂念", d: "ganfan" },
            { t: "智者不入爱河，过 520 不如过 525", d: "bailan" }
        ]},
        { text: "你的人生信条最接近哪条指令？", opts: [
            { t: "if(sad()){ sad_stop(); be_awesome(); }", d: "kongchang" },
            { t: "while(1){ eat(); sleep(); code(); }", d: "sike" },
            { t: "try{ everything(); } catch{ do_nothing(); }", d: "bailan" },
            { t: "printf(\"Hello World, I'm tired.\");", d: "pofang" }
        ]},
        { text: "距离 Deadline 前两小时，你的状态：", opts: [
            { t: "进入“超脱期”。大不了扣平时分...", d: "bailan" },
            { t: "肾上腺素飙升，打字速度突破人类极限", d: "sike" },
            { t: "向各路神仙发誓下次再也不拖延了", d: "xuanxue" },
            { t: "我从来不会出现这种情况", d: "kongchang" }
        ]},
        { text: "电脑剩 5% 电但马上要跑代码且没插座：", opts: [
            { t: "天意让我不学了，关机下课", d: "bailan" },
            { t: "屏幕调最低，关闭后台，拼死一搏", d: "sike" },
            { t: "直接拿着充电器去问学霸能不能借个位", d: "kongchang" },
            { t: "用手捂住电池试图用体温给电脑供电", d: "xuanxue" }
        ]},
        { text: "代码输出一堆“烫烫烫”，你的反应：", opts: [
            { t: "代码说它烫，它该休息了，关机睡觉", d: "bailan" },
            { t: "心酸地打开 Debug 排查数组越界", d: "sike" },
            { t: "气得去走廊暴走发泄无名火", d: "ganfan" },
            { t: "给电脑贴一张退热贴求输出正常数字", d: "xuanxue" }
        ]},
        { text: "如果“爱自己”是一个函数，返回值是？", opts: [
            { t: "boolean：今天爱了就是 true，简单直接", d: "kongchang" },
            { t: "float：爱是有程度的，从 0.0 到 1.0", d: "sike" },
            { t: "String：一句温柔的话", d: "zouxin" },
            { t: "void：不需要结果，做了就是做了", d: "bailan" }
        ]}
    ];

    const resultsMap = {
        sike: { id: "【BUGG】祖传debug仙人", tag: "[ 硬核理智 / 强迫症 / 绝对头铁 ]", quote: "只要我不睡觉，这世上就没有我跑不通的代码！", desc: "你是校园里没有感情的编译程序，大脑皮层刻满了逻辑链。面对报错，你选择狂炫咖啡修仙。你的世界只有True/False。" },
        bailan: { id: "【NULL】拔线水豚", tag: "[ 极致佛系 / 物理屏蔽 / 节能模式 ]", quote: "只要我闭上眼睛，DDL就永远追不上我。", desc: "你掌握了顶级防御机制：强制格式化自我。面对数理统计的暴击，你精神内核极度稳定。切断电源，焦虑就不存在。" },
        kongchang: { id: "【CTRL】满级人类", tag: "[ 游刃有余 / 绝对控场 / 降维打击 ]", quote: "人生就像键盘上的Ctrl，只要我在，一切尽在掌控之中。", desc: "你是隐藏的“满级人类”。别人抓耳挠腮时，你已了然于心。你不熬夜死磕，课业只是段优化到极致的算法。你是绝对控场。" },
        zouxin: { id: "【SOUL】巴甫洛夫", tag: "[ 情绪稳定器 / 灵魂共鸣 / 温柔底色 ]", quote: "爱自己是终身浪漫的开始，而你正在研究这背后的神经机制。", desc: "你保留了心理学人最纯粹的温柔。你是班级行走的“情绪稳定器”，擅长用正念化解尖锐。你是最信赖的赛博树洞。" },
        ganfan: { id: "【BITE】巴甫洛夫的狗", tag: "[ 快乐至上 / 直肠子 / 本我驱动 ]", quote: "歇斯底里是崩溃，底里歇斯是美味。", desc: "你的“本我”无比强大。不管微积分多烂，闻到食堂饭香 DNA 就会觉醒。你只相信拿到手的奶茶和嘴里的烤肉。" },
        xuanxue: { id: "【PRAY】量子道士", tag: "[ 放弃科学 / 迷信体质 / 赛博功德 ]", quote: "科学的尽头是神学，代码的尽头是玄学。", desc: "你证明了“心诚则灵”。给电脑贴退热贴、敲电子木鱼是日常基操。你不挂科全靠积攒的赛博功德和锦鲤头像。" },
        hidden: { id: "【:( / T_T】脆脆鲨", tag: "[ 易碎品 / 紧绷伪装 / 需要抱抱 ]", quote: "只要我不表现出来，就没人知道我刚刚碎了一地。", desc: "🚨 [CRITICAL ERROR] 抽到这个隐藏款的你，辛苦了！外表像鲨鱼般坚硬，内心其实是薄脆威化。今天，请允许自己彻底碎掉一会儿吧，脆弱也是种防御。" }
    };

    function startQuiz() {
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        
        // 更新进度条
        const progressPercent = ((currentIdx) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        
        document.getElementById('q-id').innerText = `root@psy-ai:~/mind$ ./run_q.sh --index ${String(currentIdx + 1).padStart(2, '0')}`;
        document.getElementById('q-text').innerText = `>> ${q.text}`;
        
        const optsDiv = document.getElementById('options');
        optsDiv.innerHTML = '';
        q.opts.forEach(o => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = o.t;
            div.onclick = () => select(o.d);
            optsDiv.appendChild(div);
        });
    }

    function select(d) {
        if (d === 'pofang') pofang++;
        else scores[d]++;
        
        currentIdx++;
        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            // 答题结束，进度条拉满
            document.getElementById('progress-bar').style.width = '100%';
            processResult();
        }
    }

    function processResult() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('calculating').classList.remove('hidden');
        document.getElementById('header-title').innerText = "root@psy-ai:~/analyzing...";

        // 模拟 1.5秒的解码加载过程
        setTimeout(() => {
            document.getElementById('calculating').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            showResultData();
        }, 1500);
    }

    function showResultData() {
        let resKey = '';
        if (pofang >= 3) {
            resKey = 'hidden';
            document.getElementById('res-id').classList.add('glitch-text');
        } else {
            resKey = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        }

        // 动态修改全局的主题样式！
        document.body.className = `theme-${resKey}`;
        document.getElementById('header-title').innerText = `root@psy-ai:~/result/${resKey}.exe`;

        const data = resultsMap[resKey];
        document.getElementById('res-id').innerText = data.id;
        document.getElementById('res-tags').innerText = data.tag;
        document.getElementById('res-quote').innerText = `"${data.quote}"`;
        document.getElementById('res-desc').innerText = data.desc;

        if (resKey !== 'hidden') {
            drawChart();
        } else {
            document.getElementById('radar-container').style.display = 'none';
        }
    }

    function drawChart() {
        // 动态获取当前主题的主色调
        const computedStyle = getComputedStyle(document.body);
        const primaryColor = computedStyle.getPropertyValue('--primary').trim();

        const ctx = document.getElementById('radarChart');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['死磕', '摆烂', '控场', '走心', '干饭', '玄学'],
                datasets: [{
                    data: [scores.sike, scores.bailan, scores.kongchang, scores.zouxin, scores.ganfan, scores.xuanxue],
                    backgroundColor: 'rgba(255, 255, 255, 0.1)',
                    borderColor: primaryColor,
                    borderWidth: 2,
                    pointBackgroundColor: primaryColor,
                    pointBorderColor: '#fff'
                }]
            },
            options: {
                scales: {
                    r: {
                        grid: { color: 'rgba(255,255,255,0.2)' },
                        angleLines: { color: 'rgba(255,255,255,0.2)' },
                        pointLabels: { color: '#ddd', font: { size: 14, family: "'VT323', monospace" } },
                        suggestedMin: 0,
                        suggestedMax: 5,
                        ticks: { display: false }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
</body>
</html>
